<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Módulo 3 Formulário de cadastro</title>
</head>
<body>
    <h2>Formulário de cadastro</h2>
    <form>
        <label for="text">Seu nome</label>
        <input id="text" type="text" /><br />
        <label for="email">Seu e-mail</label>
        <input id="email" type="email" />
        <br>
        <label for="senha">Senha</label>
        <input id="senha" type="password" /> <br>
        <label for="telefone">telefone</label>
        <input id="telefone" type="number" /> <br>
        <input type="checkbox" id="checkbox-termos" /> <label for="checkbox-termos">Aceito os termos</label>
        <button type="submit">
            Cadastrar
        </button>
    </button>
    <button type="reset">
        Limpar
    </button>
        <p>
</body>
